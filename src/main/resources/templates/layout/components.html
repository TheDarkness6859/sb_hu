<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="navbar" class="header-container">
    <h1>DashBoard</h1>

    <nav style="display: flex; gap: 15px; align-items: center;">
        <a th:href="@{/api/events}" class="btn btn-secondary" target="_blank">Api JSON</a>

        <label for="toggle-event-form" class="btn btn-primary" style="margin: 0; cursor: pointer;">+ Add Event</label>
        <label for="toggle-venue-form" class="btn btn-secondary" style="margin: 0; cursor: pointer;">+ Add Venue</label>
    </nav>
</header>

<footer th:fragment="footer" style="text-align: center; padding: 20px; color: #858585; margin-top: 40px; border-top: 1px solid #eaeaea; font-size: 14px;">
    <p>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span> TheDarkness - Junior Dev</p>
    <div style="margin-top: 10px;">
        <a th:href="@{/admin/venues}" style="color: #111111; text-decoration: underline; font-weight: 500; font-size: 13px;">Manage Registered Venues &rarr;</a>
    </div>
</footer>

</body>
</html>
