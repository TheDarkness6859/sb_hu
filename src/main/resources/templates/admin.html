<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Administración - Eventos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{layout/components :: navbar}"></div>

<input type="checkbox" id="toggle-event-form" class="form-toggle" style="display: none;">
<input type="checkbox" id="toggle-venue-form" class="form-toggle" style="display: none;">

<div class="modal-overlay event-modal">
    <div class="modal-content">
        <label for="toggle-event-form" class="close-btn">&times;</label>
        <h3>Create New Event</h3>
        <form th:action="@{/admin/events/create}" method="POST">
            <div class="form-group">
                <label>Event Name:</label>
                <input type="text" name="name" required placeholder="e.g., Twenty One Pilots Show">
            </div>
            <div class="form-group">
                <label>Venue Name:</label>
                <input type="text" name="venue.name" required placeholder="e.g., Tremendo">
            </div>

            <div class="form-group">
                <label style="display: block; margin-bottom: 8px; font-weight: bold;">Categories:</label>
                <div th:each="cat : ${allCategories}" style="display: inline-block; margin-right: 15px; margin-bottom: 5px;">
                    <input type="checkbox" th:value="${cat.id}" name="categories" th:id="'cat-' + ${cat.id}">
                    <label th:for="'cat-' + ${cat.id}" th:text="${cat.name}" style="font-weight: normal; cursor: pointer;">Category</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Save Event</button>
        </form>
    </div>
</div>

<div class="modal-overlay venue-modal">
    <div class="modal-content">
        <label for="toggle-venue-form" class="close-btn">&times;</label>
        <h3>Create New Venue</h3>
        <form th:action="@{/admin/venues/create}" method="POST">
            <div class="form-group">
                <label>Venue Name:</label>
                <input type="text" name="name" required placeholder="e.g., Auditorio Ruta N">
            </div>
            <div class="form-group">
                <label>Address:</label>
                <input type="text" name="address" required placeholder="e.g., Calle 67 # 52-20">
            </div>

            <div class="form-group">
                <label>City:</label>
                <select name="city" required style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="" disabled selected>Select a city...</option>
                    <option th:each="cityOpt : ${cities}" th:value="${cityOpt.name()}" th:text="${cityOpt.name()}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Capacity:</label>
                <input type="number" name="capacity" required placeholder="e.g., 350">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Save Venue</button>
        </form>
    </div>
</div>

<div th:if="${#lists.isEmpty(events)}" class="empty-state" style="margin-top: 20px;">
    <p>No events registered in the system currently.</p>
</div>

<div class="table-container" th:unless="${#lists.isEmpty(events)}" style="margin-top: 20px;">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Venue</th>
            <th>City</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
            <td class="uuid-text" th:text="${event.id}">00000000</td>
            <td th:text="${event.name}">Rock Concert</td>
            <td th:text="${event.venueName}">Tremendo</td>
            <td th:text="${event.city}">Medellín</td>
        </tr>
        </tbody>
    </table>
</div>

<div class="pagination-container">
    <div class="pagination-actions" style="display: flex; gap: 10px; align-items: center; margin-top: 15px;">

        <a th:if="${slice.hasPrevious()}" th:href="@{/admin/events(page=${currentPage - 1}, size=${slice.size})}" class="btn">Previous</a>
        <span th:unless="${slice.hasPrevious()}" class="btn disabled" style="opacity: 0.5; cursor: not-allowed;">Previous</span>

        <span class="page-number" th:text="'Page ' + (${currentPage} + 1)">Page 1</span>

        <a th:if="${slice.hasNext()}" th:href="@{/admin/events(page=${currentPage + 1}, size=${slice.size})}" class="btn">Next</a>
        <span th:unless="${slice.hasNext()}" class="btn disabled" style="opacity: 0.5; cursor: not-allowed;">Next</span>

    </div>
</div>

<div th:replace="~{layout/components :: footer}"></div>

</body>
</html>
